<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testing Matrix</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg: #15181B;
    --bg-panel: #1B1F23;
    --bg-card: #20252A;
    --bg-card-hover: #262C32;
    --border: #2C3238;
    --border-soft: #23282D;
    --text: #E9E7E2;
    --text-dim: #9AA1A8;
    --text-faint: #656C73;

    --st-totest: #7C8B99;
    --st-running: #4FBDA8;
    --st-paused: #D9834B;
    --st-retest: #D9C458;
    --st-killed: #C0524A;

    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }
  body{ background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; line-height: 1.5; min-height: 100vh; }

  .shell{ display:flex; min-height:100vh; }

  .rail{ width: 220px; flex-shrink:0; background: var(--bg-panel); border-right: 1px solid var(--border-soft); display:flex; flex-direction:column; padding: 24px 16px; }
  .brand{ font-family: var(--font-display); font-weight:600; font-size: 17px; letter-spacing: -0.01em; margin-bottom: 4px; }
  .brand-sub{ color: var(--text-faint); font-size:12px; margin-bottom: 24px; }

  .fam-group{ margin-bottom: 20px; }
  .fam-label{ font-size:11px; color: var(--text-faint); margin-bottom: 8px; padding: 0 10px; }
  .nav-btn{ display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left; background:none; border:none; color: var(--text-dim); font-family: var(--font-body); font-size: 14px; font-weight:500; padding: 9px 10px; border-radius: 6px; cursor:pointer; margin-bottom: 2px; }
  .nav-btn:hover{ background: var(--bg-card); color: var(--text); }
  .nav-btn.active{ background: var(--bg-card); color: var(--text); }
  .nav-btn .count{ font-size: 11px; color: var(--text-faint); font-family: var(--font-mono); }

  .rail-footer{ margin-top:auto; padding-top: 20px; border-top:1px solid var(--border-soft); }
  .buyer-field label{ display:block; font-size:11px; color: var(--text-faint); margin-bottom:6px; }
  .buyer-field input{ width:100%; background: var(--bg-card); border:1px solid var(--border); color: var(--text); font-family: var(--font-body); font-size:13px; padding: 7px 9px; border-radius: 5px; }
  .buyer-field input:focus{ outline:none; border-color: var(--text-faint); }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding: 22px 32px; border-bottom: 1px solid var(--border-soft); flex-wrap: wrap; gap: 14px; }
  .topbar h1{ font-family: var(--font-display); font-weight: 600; font-size: 20px; letter-spacing: -0.01em; }
  .topbar .sub{ color: var(--text-faint); font-size: 13px; margin-top:3px; }

  .btn{ font-family: var(--font-body); font-weight:600; font-size: 13px; padding: 9px 16px; border-radius: 6px; border: 1px solid transparent; cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
  .btn-primary{ background: var(--text); color: var(--bg); }
  .btn-primary:hover{ background: #d5d3ce; }
  .btn-ghost{ background: transparent; border-color: var(--border); color: var(--text-dim); }
  .btn-ghost:hover{ border-color: var(--text-faint); color: var(--text); }

  .content{ flex:1; padding: 24px 32px 40px; overflow-x:auto; }

  .filterbar{ display:flex; gap:8px; margin-bottom: 18px; flex-wrap: wrap; align-items:center; }
  .filterbar select, .filterbar input[type="text"]{ background: var(--bg-card); border:1px solid var(--border); color: var(--text-dim); font-family: var(--font-body); font-size: 13px; padding: 7px 10px; border-radius: 6px; }
  .filterbar input[type="text"]{ min-width: 200px; color: var(--text); }
  .filterbar select:focus, .filterbar input:focus{ outline:none; border-color: var(--text-faint); }

  .legend{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
  .legend span{ display:inline-flex; align-items:center; gap:6px; font-size:12px; color: var(--text-faint); }
  .legend .sw{ width:9px; height:9px; border-radius:2px; }

  /* matrix */
  .matrix-wrap{ overflow-x:auto; border:1px solid var(--border-soft); border-radius: 10px; }
  table.matrix{ width:100%; border-collapse: collapse; font-size: 13px; min-width: 900px; }
  table.matrix thead th{ text-align:left; padding: 12px 14px; color: var(--text-faint); font-weight:500; font-size: 12px; background: var(--bg-panel); border-bottom: 1px solid var(--border); white-space:nowrap; position: sticky; top:0; }
  table.matrix thead th.plat-col{ text-align:center; }
  table.matrix tbody td{ padding: 8px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
  table.matrix tbody tr:hover{ background: rgba(255,255,255,0.015); }
  .offer-cell{ cursor:pointer; padding: 10px 14px !important; }
  .offer-name{ font-weight:600; font-size: 13.5px; }
  .offer-adv{ color: var(--text-faint); font-size:11.5px; margin-top:2px; }
  .geo-cell{ font-family: var(--font-mono); color: var(--text-dim); font-size:12px; }
  .notes-cell{ color: var(--text-dim); font-size:12.5px; max-width:180px; cursor:pointer; }
  .notes-cell:empty::after, .notes-cell.empty::after{ content:"+ add note"; color: var(--text-faint); }

  .cell-slot{ width: 100%; height: 40px; border-radius: 6px; cursor:pointer; display:flex; align-items:center; justify-content:center; border: 1px dashed var(--border); color: var(--text-faint); font-size: 16px; }
  .cell-slot:hover{ border-color: var(--text-faint); color: var(--text-dim); }
  .status-cell{ width: 100%; min-height: 40px; border-radius: 6px; cursor:pointer; padding: 6px 8px; display:flex; flex-direction:column; justify-content:center; gap:2px; }
  .status-cell .st-label{ font-size:11.5px; font-weight:600; }
  .status-cell .st-sub{ font-size:10.5px; opacity:0.85; }

  .empty-state{ padding: 60px 20px; text-align:center; color: var(--text-faint); }
  .empty-state .btn{ margin-top: 14px; }

  /* table view */
  table.tracker{ width:100%; border-collapse: collapse; font-size: 13px; }
  table.tracker thead th{ text-align:left; padding: 10px 12px; color: var(--text-faint); font-weight:500; font-size: 12px; border-bottom: 1px solid var(--border); white-space:nowrap; }
  table.tracker tbody td{ padding: 11px 12px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
  table.tracker tbody tr{ cursor:pointer; }
  table.tracker tbody tr:hover td{ background: var(--bg-card); }
  .num{ font-family: var(--font-mono); color: var(--text-dim); font-size:12.5px; }
  .status-pill{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; padding: 3px 9px; border-radius: 20px; white-space:nowrap; }
  .status-pill .dot{ width:6px; height:6px; border-radius:50%; }
  .empty-row td{ color: var(--text-faint); text-align:center; padding: 40px 0; cursor:default; }
  .empty-row td:hover{ background:none; }

  /* drawer */
  .overlay{ position:fixed; inset:0; background: rgba(10,12,14,0.55); display:none; align-items:stretch; justify-content:flex-end; z-index: 50; }
  .overlay.open{ display:flex; }
  .drawer{ width: 420px; max-width: 92vw; background: var(--bg-panel); border-left:1px solid var(--border); padding: 26px 26px 30px; overflow-y:auto; }
  .drawer-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 20px; }
  .drawer-head h2{ font-family: var(--font-display); font-size:18px; font-weight:600; letter-spacing:-0.01em; }
  .drawer-head .dsub{ color: var(--text-faint); font-size:12.5px; margin-top:4px; }
  .close-x{ background:none; border:none; color: var(--text-faint); font-size:20px; cursor:pointer; line-height:1; padding:2px; }
  .close-x:hover{ color: var(--text); }

  .field{ margin-bottom: 16px; }
  .field label{ display:block; font-size:12px; color: var(--text-faint); margin-bottom:6px; }
  .field input[type="text"], .field input[type="date"], .field select, .field textarea{ width:100%; background: var(--bg-card); border:1px solid var(--border); color: var(--text); font-family: var(--font-body); font-size:13.5px; padding: 8px 10px; border-radius: 6px; }
  .field textarea{ min-height: 64px; resize: vertical; font-family: var(--font-body); }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color: var(--text-faint); }
  .field-row{ display:flex; gap: 10px; }
  .field-row .field{ flex:1; }

  .status-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom: 20px; }
  .status-chip{ font-size:12px; font-weight:500; padding: 6px 11px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-dim); cursor:pointer; }
  .status-chip.active{ color: var(--bg); border-color: transparent; }

  .drawer-actions{ display:flex; gap:8px; margin-top: 22px; }
  .drawer-actions .btn{ flex:1; justify-content:center; }
  .danger-link{ display:block; text-align:center; margin-top: 14px; color: var(--st-paused); font-size:12.5px; background:none; border:none; cursor:pointer; width:100%; }
  .danger-link:hover{ text-decoration: underline; }

  .toast{ position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--bg-card); border:1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 80; opacity:0; pointer-events:none; transition: opacity .2s, transform .2s; }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(-4px); }
  .loading-note{ color: var(--text-faint); font-size: 13px; padding: 20px 0; }

  @media (max-width: 720px){ .rail{ display:none; } .content{ padding: 18px; } .topbar{ padding: 18px; } }
</style>
</head>
<body>

<div class="shell">
  <div class="rail">
    <div class="brand">Testing Matrix</div>
    <div class="brand-sub">Native ops — Peppe</div>

    <div class="fam-group">
      <div class="fam-label">Families</div>
      <button class="nav-btn active" data-fam="ECOMM">ECOMM <span class="count" id="cnt-ECOMM">0</span></button>
      <button class="nav-btn" data-fam="VSL">VSL <span class="count" id="cnt-VSL">0</span></button>
    </div>

    <div class="fam-group">
      <div class="fam-label">View</div>
      <button class="nav-btn active" data-view="matrix">Matrix</button>
      <button class="nav-btn" data-view="table">List / Tracker</button>
    </div>

    <div class="rail-footer">
      <div class="buyer-field">
        <label>Viewing as</label>
        <input type="text" id="viewerName" placeholder="Your name">
      </div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div>
        <h1 id="viewTitle">ECOMM — Matrix</h1>
        <div class="sub" id="viewSub">Click an empty cell to assign a test on that platform.</div>
      </div>
      <button class="btn btn-primary" id="addBtn">+ New offer</button>
    </div>

    <div class="content">
      <div class="filterbar">
        <input type="text" id="searchInput" placeholder="Search offer, advertiser, geo...">
        <select id="filterAdvertiser"><option value="">All advertisers</option></select>
        <select id="filterStatus">
          <option value="">All statuses</option>
          <option value="to_test">To be tested</option>
          <option value="running">Running</option>
          <option value="paused">Paused</option>
          <option value="retesting">Retesting</option>
          <option value="killed">Killed</option>
        </select>
      </div>

      <div class="legend" id="legend"></div>

      <div id="matrixView"></div>
      <div id="tableView" style="display:none;">
        <table class="tracker">
          <thead>
            <tr><th>Offer</th><th>Advertiser</th><th>Geo</th><th>Platform</th><th>Buyer</th><th>Status</th><th>Started</th><th>Paused</th><th>Results</th></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="drawer" id="drawer"></div></div>
<div class="toast" id="toast"></div>

<script>
// GitHub configuration
const GITHUB_OWNER = 'quim-coder';
const GITHUB_REPO = 'campaign-pipeline';
const GITHUB_TOKEN = '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';
const GITHUB_BRANCH = 'main';
const DATA_FILE = 'data.json';

const STATUSES = [
  { key:'to_test', label:'To be tested', color:'var(--st-totest)' },
  { key:'running',  label:'Running', color:'var(--st-running)' },
  { key:'paused',  label:'Paused', color:'var(--st-paused)' },
  { key:'retesting', label:'Retesting', color:'var(--st-retest)' },
  { key:'killed',  label:'Killed', color:'var(--st-killed)' },
];
const PLATFORMS = ['OUTBRAIN','MEDIAGO','TABOOLA','MGID','ADSKEEPER','NEWSBREAK'];
const FAMILY_ADVERTISERS = {
  ECOMM: ['ORBIO','ADTRACTIVE','DFO','ADSBRANDED','PUREHEALTH','HEROCO','COMMERCO'],
  VSL: []
};

let state = { offers: [], cells: [] };
let currentFam = 'ECOMM';
let currentView = 'matrix';
let drawerMode = null;
let drawerOfferId = null;
let drawerPlatform = null;
let loaded = false;
let fileSha = null;

const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => Array.from(el.querySelectorAll(sel));
const statusOf = key => STATUSES.find(s => s.key === key) || STATUSES[0];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDate = d => { if(!d) return '—'; const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); };
const escapeHtml = s => (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function showToast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._h); showToast._h = setTimeout(()=>t.classList.remove('show'), 2200);
}

async function loadState(){
  try{
    const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_FILE}?ref=${GITHUB_BRANCH}`;
    const res = await fetch(url, {
      headers: {
        'Authorization': `token ${GITHUB_TOKEN}`,
        'Accept': 'application/vnd.github.v3+raw'
      }
    });
    if(res.ok){
      const data = await res.text();
      state = JSON.parse(data);

      // Get SHA for future updates
      const infoRes = await fetch(url, {
        headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
      });
      if(infoRes.ok){
        const infoData = await infoRes.json();
        fileSha = infoData.sha;
      }
    } else {
      state = { offers: [], cells: [] };
    }
  }catch(e){
    console.error('Load error:', e);
    state = { offers: [], cells: [] };
  }
  loaded = true;
}

async function saveState(){
  try{
    showToast('Saving...');
    const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_FILE}`;
    const content = btoa(JSON.stringify(state, null, 2));
    const message = `Update campaign data - ${new Date().toISOString()}`;

    // Get current SHA if we don't have it
    if(!fileSha){
      const getRes = await fetch(url, {
        headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
      });
      if(getRes.ok){
        const fileData = await getRes.json();
        fileSha = fileData.sha;
      }
    }

    const res = await fetch(url, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${GITHUB_TOKEN}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message,
        content,
        sha: fileSha,
        branch: GITHUB_BRANCH
      })
    });

    if(res.ok){
      const resData = await res.json();
      fileSha = resData.content.sha;
      showToast('Saved to GitHub');
    } else {
      showToast('Save failed — check your connection');
    }
  }catch(e){
    console.error('Save error:', e);
    showToast('Save failed — check your connection');
  }
}

function getViewerName(){ return $('#viewerName').value.trim(); }
function cellFor(offerId, platform){ return state.cells.find(c=>c.offerId===offerId && c.platform===platform); }

function renderLegend(){
  $('#legend').innerHTML = STATUSES.map(s=>`<span><span class="sw" style="background:${s.color}"></span>${s.label}</span>`).join('');
}

function famOffers(fam){
  return state.offers.filter(o=>o.family===fam);
}

function updateCounts(){
  $('#cnt-ECOMM').textContent = famOffers('ECOMM').length;
  $('#cnt-VSL').textContent = famOffers('VSL').length;
}

function populateFilters(){
  const advs = [...new Set(famOffers(currentFam).map(o=>o.advertiser).filter(Boolean))].sort();
  const sel = $('#filterAdvertiser');
  const cur = sel.value;
  sel.innerHTML = '<option value="">All advertisers</option>' + advs.map(a=>`<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('');
  sel.value = cur;
}

function filteredOffers(){
  const q = $('#searchInput').value.trim().toLowerCase();
  const adv = $('#filterAdvertiser').value;
  const statusFilter = $('#filterStatus').value;
  let offers = famOffers(currentFam);
  if(adv) offers = offers.filter(o=>o.advertiser===adv);
  if(q){
    offers = offers.filter(o=>{
      const hay = [o.offerName,o.advertiser,o.geo,o.notes].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  if(statusFilter){
    offers = offers.filter(o=> state.cells.some(c=>c.offerId===o.id && c.status===statusFilter));
  }
  return offers.sort((a,b)=> (a.advertiser||'').localeCompare(b.advertiser||'') || (a.offerName||'').localeCompare(b.offerName||''));
}

function render(){
  renderLegend();
  updateCounts();
  populateFilters();
  if(currentView === 'matrix') renderMatrix(); else renderTable();
}

function renderMatrix(){
  const container = $('#matrixView');
  if(!loaded){ container.innerHTML = '<div class="loading-note">Loading matrix…</div>'; return; }

  const offers = filteredOffers();
  if(offers.length===0){
    container.innerHTML = `<div class="empty-state">No offers in ${currentFam} yet.<br><button class="btn btn-primary" id="emptyAddBtn">+ New offer</button></div>`;
    $('#emptyAddBtn')?.addEventListener('click', ()=> openOfferDrawer(null));
    return;
  }

  let html = `<div class="matrix-wrap"><table class="matrix"><thead><tr>
    <th>Offer</th><th>Geo</th>
    ${PLATFORMS.map(p=>`<th class="plat-col">${p}</th>`).join('')}
    <th>Notes</th>
  </tr></thead><tbody>`;

  offers.forEach(o=>{
    html += `<tr>
      <td class="offer-cell" data-offer="${o.id}">
        <div class="offer-name">${escapeHtml(o.offerName)}</div>
        <div class="offer-adv">${escapeHtml(o.advertiser)}</div>
      </td>
      <td class="geo-cell">${escapeHtml(o.geo||'—')}</td>
      ${PLATFORMS.map(p=>{
        const c = cellFor(o.id, p);
        if(!c){
          return `<td><div class="cell-slot" data-offer="${o.id}" data-platform="${p}">+</div></td>`;
        }
        const st = statusOf(c.status);
        const sub = c.status==='paused' ? (c.pauseReason || fmtDate(c.pausedAt)) : (c.buyer || fmtDate(c.startedAt));
        return `<td><div class="status-cell" data-offer="${o.id}" data-platform="${p}" style="background:${st.color}22;">
          <span class="st-label" style="color:${st.color}">${st.label}</span>
          <span class="st-sub" style="color:var(--text-faint)">${escapeHtml(sub||'')}</span>
        </div></td>`;
      }).join('')}
      <td class="notes-cell ${o.notes? '' : 'empty'}" data-offer-notes="${o.id}">${escapeHtml(o.notes||'')}</td>
    </tr>`;
  });

  html += '</tbody></table></div>';
  container.innerHTML = html;

  $$('.offer-cell', container).forEach(el=> el.addEventListener('click', ()=> openOfferDrawer(el.dataset.offer)));
  $$('.notes-cell', container).forEach(el=> el.addEventListener('click', ()=> openOfferDrawer(el.dataset.offerNotes)));
  $$('.cell-slot, .status-cell', container).forEach(el=>{
    el.addEventListener('click', ()=> openCellDrawer(el.dataset.offer, el.dataset.platform));
  });
}

function renderTable(){
  const tbody = $('#tableBody');
  if(!loaded){ tbody.innerHTML = '<tr class="empty-row"><td colspan="9">Loading…</td></tr>'; return; }

  const offers = filteredOffers();
  const rows = [];
  offers.forEach(o=>{
    PLATFORMS.forEach(p=>{
      const c = cellFor(o.id, p);
      if(c) rows.push({o,c,p});
    });
  });
  const statusFilter = $('#filterStatus').value;
  const finalRows = statusFilter ? rows.filter(r=>r.c.status===statusFilter) : rows;

  if(finalRows.length===0){ tbody.innerHTML = '<tr class="empty-row"><td colspan="9">No tests match these filters yet.</td></tr>'; return; }

  finalRows.sort((a,b)=> (b.c.updatedAt||'').localeCompare(a.c.updatedAt||''));

  tbody.innerHTML = finalRows.map(({o,c,p})=>{
    const st = statusOf(c.status);
    return `<tr data-offer="${o.id}" data-platform="${p}">
      <td style="font-weight:600">${escapeHtml(o.offerName)}</td>
      <td>${escapeHtml(o.advertiser)}</td>
      <td>${escapeHtml(o.geo||'—')}</td>
      <td>${p}</td>
      <td>${escapeHtml(c.buyer||'—')}</td>
      <td><span class="status-pill" style="background:${st.color}22; color:${st.color}"><span class="dot" style="background:${st.color}"></span>${st.label}</span></td>
      <td class="num">${fmtDate(c.startedAt)}</td>
      <td class="num">${c.pausedAt ? fmtDate(c.pausedAt) + (c.pauseReason ? ' — '+escapeHtml(c.pauseReason) : '') : '—'}</td>
      <td>${escapeHtml(c.results||'—')}</td>
    </tr>`;
  }).join('');

  $$('tr[data-offer]', tbody).forEach(row=>{
    row.addEventListener('click', ()=> openCellDrawer(row.dataset.offer, row.dataset.platform));
  });
}

/* ---------- offer drawer ---------- */
function openOfferDrawer(offerId){
  drawerMode = 'offer';
  drawerOfferId = offerId || null;
  const o = offerId ? state.offers.find(x=>x.id===offerId) : null;
  const drawer = $('#drawer');
  const advList = FAMILY_ADVERTISERS[currentFam] || [];

  drawer.innerHTML = `
    <div class="drawer-head">
      <div><h2>${o ? 'Edit offer' : 'New offer'}</h2><div class="dsub">${currentFam}</div></div>
      <button class="close-x" id="closeDrawer">&times;</button>
    </div>
    <div class="field">
      <label>Advertiser</label>
      <input type="text" id="f-advertiser" list="advList" value="${escapeHtml(o?.advertiser||'')}" placeholder="e.g. ORBIO">
      <datalist id="advList">${advList.map(a=>`<option value="${a}">`).join('')}</datalist>
    </div>
    <div class="field-row">
      <div class="field"><label>Offer name</label><input type="text" id="f-offername" value="${escapeHtml(o?.offerName||'')}" placeholder="e.g. STABLEGRIP"></div>
      <div class="field"><label>Geo</label><input type="text" id="f-geo" value="${escapeHtml(o?.geo||'')}" placeholder="e.g. Tier1"></div>
    </div>
    <div class="field"><label>Notes</label><textarea id="f-notes" placeholder="General notes about this offer...">${escapeHtml(o?.notes||'')}</textarea></div>
    <div class="drawer-actions">
      <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">${o ? 'Save changes' : 'Add offer'}</button>
    </div>
    ${o ? '<button class="danger-link" id="deleteBtn">Remove offer (and all its tests)</button>' : ''}
  `;

  $('#closeDrawer').addEventListener('click', closeDrawer);
  $('#cancelBtn').addEventListener('click', closeDrawer);
  if(o) $('#deleteBtn').addEventListener('click', ()=> deleteOffer(o.id));
  $('#saveBtn').addEventListener('click', saveOfferFromDrawer);
  $('#overlay').classList.add('open');
}

async function saveOfferFromDrawer(){
  const advertiser = $('#f-advertiser').value.trim();
  const offerName = $('#f-offername').value.trim();
  if(!advertiser || !offerName){ showToast('Advertiser and offer name are required'); return; }
  const data = { advertiser, offerName, geo: $('#f-geo').value.trim(), notes: $('#f-notes').value.trim() };

  if(drawerOfferId){
    const idx = state.offers.findIndex(o=>o.id===drawerOfferId);
    if(idx>-1) state.offers[idx] = { ...state.offers[idx], ...data };
    showToast('Offer updated');
  }else{
    state.offers.push({ id: uid(), family: currentFam, createdAt: new Date().toISOString(), createdBy: getViewerName(), ...data });
    showToast('Offer added');
  }
  await saveState();
  closeDrawer();
  render();
}

async function deleteOffer(id){
  state.offers = state.offers.filter(o=>o.id!==id);
  state.cells = state.cells.filter(c=>c.offerId!==id);
  await saveState();
  closeDrawer();
  render();
  showToast('Offer removed');
}

/* ---------- cell (platform test) drawer ---------- */
function openCellDrawer(offerId, platform){
  drawerMode = 'cell';
  drawerOfferId = offerId;
  drawerPlatform = platform;
  const o = state.offers.find(x=>x.id===offerId);
  const c = cellFor(offerId, platform);
  const drawer = $('#drawer');

  drawer.innerHTML = `
    <div class="drawer-head">
      <div><h2>${platform}</h2><div class="dsub">${escapeHtml(o.offerName)} — ${escapeHtml(o.advertiser)} · ${escapeHtml(o.geo||'—')}</div></div>
      <button class="close-x" id="closeDrawer">&times;</button>
    </div>
    <div class="field"><label>Status</label><div class="status-row" id="statusRow"></div></div>
    <div class="field-row">
      <div class="field"><label>Started receiving traffic</label><input type="date" id="f-started" value="${c?.startedAt||''}"></div>
      <div class="field"><label>Paused on</label><input type="date" id="f-paused" value="${c?.pausedAt||''}"></div>
    </div>
    <div class="field"><label>Pause / kill reason</label><input type="text" id="f-pausereason" value="${escapeHtml(c?.pauseReason||'')}" placeholder="e.g. CPA above cap, 0 rev, disapproved..."></div>
    <div class="field"><label>Assigned buyer</label><input type="text" id="f-buyer" value="${escapeHtml(c?.buyer||'')}" placeholder="e.g. Marco"></div>
    <div class="field"><label>Results / notes</label><textarea id="f-results" placeholder="Spend, ROI, conversions, tracker link...">${escapeHtml(c?.results||'')}</textarea></div>
    <div class="drawer-actions">
      <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">${c ? 'Save changes' : 'Add test'}</button>
    </div>
    ${c ? '<button class="danger-link" id="deleteBtn">Remove this platform test</button>' : ''}
  `;

  let selectedStatus = c?.status || 'to_test';
  const statusRow = $('#statusRow');
  STATUSES.forEach(st=>{
    const chip = document.createElement('button');
    chip.type='button';
    chip.className = 'status-chip' + (st.key===selectedStatus ? ' active' : '');
    chip.textContent = st.label;
    chip.style.background = st.key===selectedStatus ? st.color : '';
    chip.addEventListener('click', ()=>{
      selectedStatus = st.key;
      $$('.status-chip', statusRow).forEach(ch=>{ ch.classList.remove('active'); ch.style.background=''; });
      chip.classList.add('active'); chip.style.background = st.color;
      const startedField = $('#f-started'), pausedField = $('#f-paused');
      if((st.key==='running'||st.key==='retesting') && !startedField.value) startedField.value = todayISO();
      if(st.key==='paused' && !pausedField.value) pausedField.value = todayISO();
    });
    statusRow.appendChild(chip);
  });

  $('#closeDrawer').addEventListener('click', closeDrawer);
  $('#cancelBtn').addEventListener('click', closeDrawer);
  if(c) $('#deleteBtn').addEventListener('click', ()=> deleteCell(c.id));
  $('#saveBtn').addEventListener('click', ()=> saveCellFromDrawer(selectedStatus));
  $('#overlay').classList.add('open');
}

async function saveCellFromDrawer(status){
  const data = {
    offerId: drawerOfferId, platform: drawerPlatform, status,
    startedAt: $('#f-started').value, pausedAt: $('#f-paused').value,
    pauseReason: $('#f-pausereason').value.trim(), buyer: $('#f-buyer').value.trim(),
    results: $('#f-results').value.trim(), updatedAt: new Date().toISOString(),
  };
  const existing = cellFor(drawerOfferId, drawerPlatform);
  if(existing){
    const idx = state.cells.findIndex(c=>c.id===existing.id);
    state.cells[idx] = { ...state.cells[idx], ...data };
    showToast('Test updated');
  }else{
    state.cells.push({ id: uid(), createdAt: new Date().toISOString(), createdBy: getViewerName(), ...data });
    showToast('Test assigned');
  }
  await saveState();
  closeDrawer();
  render();
}

async function deleteCell(id){
  state.cells = state.cells.filter(c=>c.id!==id);
  await saveState();
  closeDrawer();
  render();
  showToast('Test removed');
}

function closeDrawer(){ $('#overlay').classList.remove('open'); drawerMode=null; drawerOfferId=null; drawerPlatform=null; }

/* ---------- wiring ---------- */
$$('[data-fam]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    $$('[data-fam]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFam = btn.dataset.fam;
    $('#viewTitle').textContent = `${currentFam} — ${currentView==='matrix'?'Matrix':'List / Tracker'}`;
    render();
  });
});
$$('[data-view]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    $$('[data-view]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentView = btn.dataset.view;
    $('#matrixView').style.display = currentView==='matrix' ? '' : 'none';
    $('#tableView').style.display = currentView==='table' ? '' : 'none';
    $('#viewTitle').textContent = `${currentFam} — ${currentView==='matrix'?'Matrix':'List / Tracker'}`;
    $('#viewSub').textContent = currentView==='matrix' ? 'Click an empty cell to assign a test on that platform.' : 'Every platform test, filterable and sortable.';
    render();
  });
});
$('#addBtn').addEventListener('click', ()=> openOfferDrawer(null));
$('#overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeDrawer(); });
$('#searchInput').addEventListener('input', render);
$('#filterAdvertiser').addEventListener('change', render);
$('#filterStatus').addEventListener('change', render);

(async function init(){
  await loadState();
  render();
})();
</script>
</body>
</html>
