<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testing Matrix</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg: #15181B;
    --bg-panel: #1B1F23;
    --bg-card: #20252A;
    --bg-card-hover: #262C32;
    --border: #2C3238;
    --border-soft: #23282D;
    --text: #FFFFFF;
    --text-dim: #FFFFFF;
    --text-faint: #FFFFFF;

    --st-totest: #7C8B99;
    --st-running: #4FBDA8;
    --st-paused: #D9834B;
    --st-retest: #D9C458;
    --st-killed: #C0524A;

    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }
  body{ background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; line-height: 1.5; min-height: 100vh; }

  .shell{ display:flex; min-height:100vh; }

  .rail{ width: 220px; flex-shrink:0; background: var(--bg-panel); border-right: 1px solid var(--border-soft); display:flex; flex-direction:column; padding: 24px 16px; }
  .brand{ font-family: var(--font-display); font-weight:600; font-size: 17px; letter-spacing: -0.01em; margin-bottom: 4px; }
  .brand-sub{ color: #FFFFFF; font-size:12px; margin-bottom: 24px; }

  .fam-group{ margin-bottom: 20px; }
  .fam-label{ font-size:11px; color: #FFFFFF; margin-bottom: 8px; padding: 0 10px; }
  .nav-btn{ display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left; background:none; border:none; color: #FFFFFF; font-family: var(--font-body); font-size: 14px; font-weight:500; padding: 9px 10px; border-radius: 6px; cursor:pointer; margin-bottom: 2px; }
  .nav-btn:hover{ background: var(--bg-card); color: var(--text); }
  .nav-btn.active{ background: var(--bg-card); color: var(--text); }
  .nav-btn .count{ font-size: 11px; color: #FFFFFF; font-family: var(--font-mono); }

  .rail-footer{ margin-top:auto; padding-top: 20px; border-top:1px solid var(--border-soft); }
  .buyer-field label{ display:block; font-size:11px; color: #FFFFFF; margin-bottom:6px; }
  .buyer-field input{ width:100%; background: var(--bg-card); border:1px solid var(--border); color: var(--text); font-family: var(--font-body); font-size:13px; padding: 7px 9px; border-radius: 5px; }
  .buyer-field input:focus{ outline:none; border-color: #FFFFFF; }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding: 22px 32px; border-bottom: 1px solid var(--border-soft); flex-wrap: wrap; gap: 14px; }
  .topbar h1{ font-family: var(--font-display); font-weight: 600; font-size: 20px; letter-spacing: -0.01em; }
  .topbar .sub{ color: #FFFFFF; font-size: 13px; margin-top:3px; }

  .btn{ font-family: var(--font-body); font-weight:600; font-size: 13px; padding: 9px 16px; border-radius: 6px; border: 1px solid transparent; cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
  .btn-primary{ background: var(--text); color: var(--bg); }
  .btn-primary:hover{ background: #d5d3ce; }
  .btn-ghost{ background: transparent; border-color: var(--border); color: #FFFFFF; }
  .btn-ghost:hover{ border-color: #FFFFFF; color: var(--text); }

  .content{ flex:1; padding: 24px 32px 40px; overflow-x:auto; }

  .filterbar{ display:flex; gap:8px; margin-bottom: 18px; flex-wrap: wrap; align-items:center; }
  .filterbar select, .filterbar input[type="text"]{ background: var(--bg-card); border:1px solid var(--border); color: #FFFFFF; font-family: var(--font-body); font-size: 13px; padding: 7px 10px; border-radius: 6px; }
  .filterbar input[type="text"]{ min-width: 200px; color: var(--text); }
  .filterbar select:focus, .filterbar input:focus{ outline:none; border-color: #FFFFFF; }

  .legend{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
  .legend span{ display:inline-flex; align-items:center; gap:6px; font-size:12px; color: #FFFFFF; }
  .legend .sw{ width:9px; height:9px; border-radius:2px; }

  /* matrix */
  .matrix-wrap{ overflow-x:auto; border:1px solid var(--border-soft); border-radius: 10px; }
  table.matrix{ width:100%; border-collapse: collapse; font-size: 13px; min-width: 900px; }
  table.matrix thead th{ text-align:left; padding: 12px 14px; color: #FFFFFF; font-weight:500; font-size: 12px; background: var(--bg-panel); border-bottom: 1px solid var(--border); white-space:nowrap; position: sticky; top:0; }
  table.matrix thead th.plat-col{ text-align:center; }
  table.matrix tbody td{ padding: 8px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
  table.matrix tbody tr:hover{ background: rgba(255,255,255,0.015); }
  .offer-cell{ cursor:pointer; padding: 10px 14px !important; }
  .offer-name{ font-weight:600; font-size: 13.5px; }
  .offer-adv{ color: #FFFFFF; font-size:11.5px; margin-top:2px; }
  .geo-cell{ font-family: var(--font-mono); color: #FFFFFF; font-size:12px; }
  .notes-cell{ color: #FFFFFF; font-size:12.5px; max-width:180px; cursor:pointer; }
  .notes-cell:empty::after, .notes-cell.empty::after{ content:"+ add note"; color: #FFFFFF; }

  .material-cell{ display:flex; flex-wrap:wrap; gap:4px; max-width:160px; cursor:pointer; }
  .material-cell.empty::after{ content:"+ add link"; color: #FFFFFF; font-size:12px; }
  .material-chip{ font-size:11px; color: #FFFFFF; background: var(--bg-card); border:1px solid var(--border-soft); padding: 2px 8px; border-radius: 20px; text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100px; display:inline-block; }
  .material-chip:hover{ color: var(--text); border-color: #FFFFFF; }

  .materials-box{ margin-bottom: 16px; }
  .material-item{ display:flex; align-items:center; justify-content:space-between; gap:8px; background: var(--bg-card); border:1px solid var(--border); border-radius:6px; padding: 7px 9px; margin-bottom:6px; font-size:12.5px; }
  .material-item a{ color: var(--text); text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .material-item a:hover{ text-decoration:underline; }
  .material-item .rm{ background:none; border:none; color: #FFFFFF; cursor:pointer; font-size:15px; line-height:1; flex-shrink:0; }
  .material-item .rm:hover{ color: var(--st-paused); }
  .material-add-row{ display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
  .material-add-row input{ background: var(--bg-card); border:1px solid var(--border); color: var(--text); font-family: var(--font-body); font-size:12.5px; padding: 7px 9px; border-radius: 6px; min-width: 0; }
  .material-add-row input.url{ flex:2 1 160px; }
  .material-add-row input.label{ flex:1 1 100px; }
  .material-empty{ color: #FFFFFF; font-size:12px; margin-bottom:8px; }

  .actions-cell{ display:flex; gap:6px; align-items:center; }
  .action-btn{ background:none; border:none; color: #FFFFFF; cursor:pointer; font-size:14px; padding:4px 8px; border-radius:4px; transition:0.2s; }
  .action-btn:hover{ background: var(--bg-card); }
  .action-btn.archive{ color: #D9C458; }
  .action-btn.delete{ color: #C0524A; }

  .country-selector{ position:relative; }
  .country-picker{ display:none; position:absolute; top:100%; left:0; right:0; background: var(--bg-card); border:1px solid var(--border); border-radius:6px; z-index:100; max-height:300px; overflow-y:auto; margin-top:4px; }
  .country-picker.open{ display:block; }
  .country-search{ padding:8px; border-bottom:1px solid var(--border); position:sticky; top:0; background: var(--bg-card); }
  .country-search input{ width:100%; background: var(--bg-panel); border:1px solid var(--border); color: var(--text); font-size:13px; padding:6px 8px; border-radius:4px; }
  .country-search input:focus{ outline:none; border-color: #FFFFFF; }
  .country-option{ padding:8px 12px; cursor:pointer; font-size:13px; border-bottom:1px solid var(--border-soft); }
  .country-option:hover{ background: var(--bg-panel); }
  .country-option.selected{ background: var(--border); color: #4FBDA8; font-weight:500; }
  .country-chips{ display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px; min-height:24px; }
  .country-chip{ font-size:12px; background: var(--border); color: var(--text); padding:4px 8px; border-radius:12px; display:flex; align-items:center; gap:4px; }
  .country-chip .remove{ cursor:pointer; font-weight:bold; margin-left:2px; }
  .country-chip .remove:hover{ color: #C0524A; }

  .cell-slot{ width: 100%; height: 40px; border-radius: 6px; cursor:pointer; display:flex; align-items:center; justify-content:center; border: 1px dashed var(--border); color: #FFFFFF; font-size: 16px; }
  .cell-slot:hover{ border-color: #FFFFFF; color: #FFFFFF; }
  .status-cell{ width: 100%; min-height: 40px; border-radius: 6px; cursor:pointer; padding: 6px 8px; display:flex; flex-direction:column; justify-content:center; gap:2px; }
  .status-cell .st-label{ font-size:11.5px; font-weight:600; }
  .status-cell .st-sub{ font-size:10.5px; opacity:0.85; }

  .empty-state{ padding: 60px 20px; text-align:center; color: #FFFFFF; }
  .empty-state .btn{ margin-top: 14px; }

  /* table view */
  table.tracker{ width:100%; border-collapse: collapse; font-size: 13px; }
  table.tracker thead th{ text-align:left; padding: 10px 12px; color: #FFFFFF; font-weight:500; font-size: 12px; border-bottom: 1px solid var(--border); white-space:nowrap; }
  table.tracker tbody td{ padding: 11px 12px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
  table.tracker tbody tr{ cursor:pointer; }
  table.tracker tbody tr:hover td{ background: var(--bg-card); }
  .num{ font-family: var(--font-mono); color: #FFFFFF; font-size:12.5px; }
  .status-pill{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; padding: 3px 9px; border-radius: 20px; white-space:nowrap; }
  .status-pill .dot{ width:6px; height:6px; border-radius:50%; }
  .empty-row td{ color: #FFFFFF; text-align:center; padding: 40px 0; cursor:default; }
  .empty-row td:hover{ background:none; }

  /* drawer */
  .overlay{ position:fixed; inset:0; background: rgba(10,12,14,0.55); display:none; align-items:stretch; justify-content:flex-end; z-index: 50; }
  .overlay.open{ display:flex; }
  .drawer{ width: 420px; max-width: 92vw; background: var(--bg-panel); border-left:1px solid var(--border); padding: 26px 26px 30px; overflow-y:auto; }
  .drawer-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 20px; }
  .drawer-head h2{ font-family: var(--font-display); font-size:18px; font-weight:600; letter-spacing:-0.01em; }
  .drawer-head .dsub{ color: #FFFFFF; font-size:12.5px; margin-top:4px; }
  .close-x{ background:none; border:none; color: #FFFFFF; font-size:20px; cursor:pointer; line-height:1; padding:2px; }
  .close-x:hover{ color: var(--text); }

  .field{ margin-bottom: 16px; }
  .field label{ display:block; font-size:12px; color: #FFFFFF; margin-bottom:6px; }
  .field input[type="text"], .field input[type="date"], .field select, .field textarea{ width:100%; background: var(--bg-card); border:1px solid var(--border); color: var(--text); font-family: var(--font-body); font-size:13.5px; padding: 8px 10px; border-radius: 6px; }
  .field textarea{ min-height: 64px; resize: vertical; font-family: var(--font-body); }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color: #FFFFFF; }
  .field-row{ display:flex; gap: 10px; }
  .field-row .field{ flex:1; }

  .status-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom: 20px; }
  .status-chip{ font-size:12px; font-weight:500; padding: 6px 11px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg-card); color: #FFFFFF; cursor:pointer; }
  .status-chip.active{ color: var(--bg); border-color: transparent; }

  .drawer-actions{ display:flex; gap:8px; margin-top: 22px; }
  .drawer-actions .btn{ flex:1; justify-content:center; }
  .danger-link{ display:block; text-align:center; margin-top: 14px; color: var(--st-paused); font-size:12.5px; background:none; border:none; cursor:pointer; width:100%; }
  .danger-link:hover{ text-decoration: underline; }

  .toast{ position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--bg-card); border:1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 80; opacity:0; pointer-events:none; transition: opacity .2s, transform .2s; }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(-4px); }
  .loading-note{ color: #FFFFFF; font-size: 13px; padding: 20px 0; }

  @media (max-width: 720px){ .rail{ display:none; } .content{ padding: 18px; } .topbar{ padding: 18px; } }
</style>
</head>
<body>

<div class="shell">
  <div class="rail">
    <div class="brand">Testing Matrix</div>
    <div class="brand-sub">Native ops — Peppe</div>

    <div class="fam-group">
      <div class="fam-label">Families</div>
      <button class="nav-btn active" data-fam="ECOMM">ECOMM <span class="count" id="cnt-ECOMM">0</span></button>
      <button class="nav-btn" data-fam="VSL">VSL <span class="count" id="cnt-VSL">0</span></button>
      <button class="nav-btn" data-fam="LEADGEN">LEADGEN <span class="count" id="cnt-LEADGEN">0</span></button>
      <button class="nav-btn" data-fam="POTENTIALS">POTENTIALS <span class="count" id="cnt-POTENTIALS">0</span></button>
    </div>

    <div class="fam-group">
      <div class="fam-label">View</div>
      <button class="nav-btn active" data-view="matrix">Matrix</button>
      <button class="nav-btn" data-view="table">List / Tracker</button>
    </div>

    <div class="rail-footer">
      <div class="buyer-field">
        <label>Viewing as</label>
        <input type="text" id="viewerName" placeholder="Your name">
      </div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div>
        <h1 id="viewTitle">ECOMM — Matrix</h1>
        <div class="sub" id="viewSub">Click an empty cell to assign a test on that platform.</div>
      </div>
      <button class="btn btn-primary" id="addBtn">+ New offer</button>
    </div>

    <div class="content">
      <div class="filterbar">
        <input type="text" id="searchInput" placeholder="Search offer, advertiser, geo...">
        <select id="filterAdvertiser"><option value="">All advertisers</option></select>
        <select id="filterStatus">
          <option value="">All statuses</option>
          <option value="to_test">To be tested</option>
          <option value="running">Running</option>
          <option value="paused">Paused</option>
          <option value="retesting">Retesting</option>
          <option value="killed">Killed</option>
        </select>
      </div>

      <div class="legend" id="legend"></div>

      <div id="matrixView"></div>
      <div id="tableView" style="display:none;">
        <table class="tracker">
          <thead>
            <tr><th>Offer</th><th>Advertiser</th><th>Geo</th><th>Platform</th><th>Buyer</th><th>Status</th><th>Started</th><th>Paused</th><th>Results</th></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="drawer" id="drawer"></div></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>

<script>
// Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyB9UAUE269KIL0du6sDZqx2MbMY2ALlU9A",
  authDomain: "campaign-pipeline-70854.firebaseapp.com",
  databaseURL: "https://campaign-pipeline-70854-default-rtdb.firebaseio.com",
  projectId: "campaign-pipeline-70854",
  storageBucket: "campaign-pipeline-70854.firebasestorage.app",
  messagingSenderId: "23053574848",
  appId: "1:23053574848:web:ae07a2f800abc994672313",
  measurementId: "G-Z1JNXT9ETH"
};

// Initialize Firebase
firebase.initializeApp(firebaseConfig);
const database = firebase.database();

const STATUSES = [
  { key:'to_test', label:'To be tested', color:'var(--st-totest)' },
  { key:'running',  label:'Running', color:'var(--st-running)' },
  { key:'paused',  label:'Paused', color:'var(--st-paused)' },
  { key:'retesting', label:'Retesting', color:'var(--st-retest)' },
  { key:'killed',  label:'Killed', color:'var(--st-killed)' },
  { key:'pending', label:'Pending', color:'#9AA1A8' },
  { key:'rejected', label:'Rejected', color:'#7C3A3A' },
];
const PLATFORMS = ['OUTBRAIN','MEDIAGO','TABOOLA','MGID','ADSKEEPER','NEWSBREAK'];
const COUNTRIES = [
  {code:'US', name:'United States'}, {code:'GB', name:'United Kingdom'}, {code:'CA', name:'Canada'},
  {code:'AU', name:'Australia'}, {code:'DE', name:'Germany'}, {code:'FR', name:'France'},
  {code:'IT', name:'Italy'}, {code:'ES', name:'Spain'}, {code:'NL', name:'Netherlands'},
  {code:'SE', name:'Sweden'}, {code:'NO', name:'Norway'}, {code:'DK', name:'Denmark'},
  {code:'BE', name:'Belgium'}, {code:'CH', name:'Switzerland'}, {code:'AT', name:'Austria'},
  {code:'PL', name:'Poland'}, {code:'CZ', name:'Czech Republic'}, {code:'RO', name:'Romania'},
  {code:'BR', name:'Brazil'}, {code:'MX', name:'Mexico'}, {code:'AR', name:'Argentina'},
  {code:'JP', name:'Japan'}, {code:'CN', name:'China'}, {code:'IN', name:'India'},
  {code:'SG', name:'Singapore'}, {code:'HK', name:'Hong Kong'}, {code:'NZ', name:'New Zealand'}
];
const FAMILY_ADVERTISERS = {
  ECOMM: ['ORBIO','ADTRACTIVE','DFO','ADSBRANDED','PUREHEALTH','HEROCO','COMMERCO'],
  VSL: [],
  LEADGEN: [],
  POTENTIALS: ['ORBIO','ADTRACTIVE','DFO','ADSBRANDED','PUREHEALTH','HEROCO','COMMERCO']
};

let state = { offers: [], cells: [] };
let currentFam = 'ECOMM';
let currentView = 'matrix';
let drawerMode = null;
let drawerOfferId = null;
let drawerPlatform = null;
let loaded = false;
let fileSha = null;
let draftGeos = [];

const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => Array.from(el.querySelectorAll(sel));
const statusOf = key => STATUSES.find(s => s.key === key) || STATUSES[0];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDate = d => { if(!d) return '—'; const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); };
const escapeHtml = s => (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function showToast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._h); showToast._h = setTimeout(()=>t.classList.remove('show'), 2200);
}

function migrateGeoFormat(state){
  if(state.offers){
    state.offers.forEach(o=>{
      if(o.geo && typeof o.geo === 'string'){
        o.geo = [];
      }else if(!Array.isArray(o.geo)){
        o.geo = [];
      }
    });
  }
  return state;
}

async function loadState(){
  try{
    const snapshot = await database.ref('state').get();
    if(snapshot.exists()){
      state = snapshot.val();
      // Ensure cells array exists
      if(!state.cells) state.cells = [];
      if(!state.offers) state.offers = [];
      state = migrateGeoFormat(state);
    } else {
      state = { offers: [], cells: [] };
      await database.ref('state').set(state);
    }
  }catch(e){
    console.error('Load error:', e);
    state = { offers: [], cells: [] };
  }
  loaded = true;

  // Listen for real-time updates
  database.ref('state').on('value', (snapshot) => {
    if(snapshot.exists()){
      state = snapshot.val();
      if(!state.cells) state.cells = [];
      if(!state.offers) state.offers = [];
      state = migrateGeoFormat(state);
      render();
    }
  });
}

async function saveState(){
  try{
    showToast('Saving...');
    await database.ref('state').set(state);
    showToast('Saved ✓');
  }catch(e){
    console.error('Save error:', e);
    showToast('Save failed — check your connection');
  }
}

function getViewerName(){ return $('#viewerName').value.trim(); }
function cellFor(offerId, platform){ return state.cells.find(c=>c.offerId===offerId && c.platform===platform); }

function renderLegend(){
  $('#legend').innerHTML = STATUSES.map(s=>`<span><span class="sw" style="background:${s.color}"></span>${s.label}</span>`).join('');
}

function famOffers(fam){
  return state.offers.filter(o=>o.family===fam);
}

function updateCounts(){
  $('#cnt-ECOMM').textContent = famOffers('ECOMM').length;
  $('#cnt-VSL').textContent = famOffers('VSL').length;
  $('#cnt-LEADGEN').textContent = famOffers('LEADGEN').length;
  $('#cnt-POTENTIALS').textContent = famOffers('POTENTIALS').length;
}

function populateFilters(){
  const advs = [...new Set(famOffers(currentFam).map(o=>o.advertiser).filter(Boolean))].sort();
  const sel = $('#filterAdvertiser');
  const cur = sel.value;
  sel.innerHTML = '<option value="">All advertisers</option>' + advs.map(a=>`<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('');
  sel.value = cur;
}

function filteredOffers(){
  const q = $('#searchInput').value.trim().toLowerCase();
  const adv = $('#filterAdvertiser').value;
  const statusFilter = $('#filterStatus').value;
  let offers = famOffers(currentFam).filter(o=>!o.archived);
  if(adv) offers = offers.filter(o=>o.advertiser===adv);
  if(q){
    offers = offers.filter(o=>{
      const geoStr = Array.isArray(o.geo) ? o.geo.join(' ') : (o.geo||'');
      const hay = [o.offerName,o.advertiser,geoStr,o.notes].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  if(statusFilter){
    offers = offers.filter(o=> state.cells.some(c=>c.offerId===o.id && c.status===statusFilter));
  }
  return offers.sort((a,b)=> (a.advertiser||'').localeCompare(b.advertiser||'') || (a.offerName||'').localeCompare(b.offerName||''));
}

function render(){
  renderLegend();
  updateCounts();
  populateFilters();
  if(currentView === 'matrix') renderMatrix(); else renderTable();
}

function renderMatrix(){
  const container = $('#matrixView');
  if(!loaded){ container.innerHTML = '<div class="loading-note">Loading matrix…</div>'; return; }

  const offers = filteredOffers();
  if(offers.length===0){
    container.innerHTML = `<div class="empty-state">No offers in ${currentFam} yet.<br><button class="btn btn-primary" id="emptyAddBtn">+ New offer</button></div>`;
    $('#emptyAddBtn')?.addEventListener('click', ()=> openOfferDrawer(null));
    return;
  }

  const isPotentials = currentFam === 'POTENTIALS';
  let html = '';

  if(isPotentials){
    html = `<div class="matrix-wrap"><table class="matrix"><thead><tr>
      <th>Offer</th><th>Advertiser</th><th>Geo</th><th>Material</th><th>Notes</th><th>Actions</th>
    </tr></thead><tbody>`;
  } else {
    const platformLogos = {
      OUTBRAIN: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#FF6600"/></svg>',
      MEDIAGO: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#2E5BFF"/></svg>',
      TABOOLA: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#003366"/></svg>',
      MGID: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#0052CC"/></svg>',
      ADSKEEPER: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#1a1a1a"/></svg>',
      NEWSBREAK: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#FF3333"/></svg>'
    };
    html = `<div class="matrix-wrap"><table class="matrix"><thead><tr>
      <th>Offer</th><th>Geo</th>
      ${PLATFORMS.map(p=>`<th class="plat-col"><div style="width:14px;height:14px;margin:0 auto 3px;">${platformLogos[p]}</div><div style="font-size:7px;text-transform:uppercase;font-weight:500;letter-spacing:0.3px;">${p}</div></th>`).join('')}
      <th>Material</th><th>Notes</th><th>Actions</th>
    </tr></thead><tbody>`;
  }

  offers.forEach(o=>{
    const geoDisplay = (Array.isArray(o.geo) && o.geo.length > 0)
      ? o.geo.map(code=>COUNTRIES.find(c=>c.code===code)?.name||code).join(', ')
      : '—';

    if(isPotentials){
      html += `<tr>
        <td class="offer-cell" data-offer="${o.id}">
          <div class="offer-name">${escapeHtml(o.offerName)}</div>
        </td>
        <td>${escapeHtml(o.advertiser||'—')}</td>
        <td class="geo-cell">${escapeHtml(geoDisplay)}</td>
        <td><div class="material-cell ${(o.materials&&o.materials.length)? '' : 'empty'}" data-offer-mat="${o.id}">${(o.materials||[]).map(m=>`<a class="material-chip" href="${escapeHtml(m.url)}" target="_blank" rel="noopener" title="${escapeHtml(m.label||m.url)}" onclick="event.stopPropagation()">${escapeHtml(m.label || m.url.replace(/^https?:\/\//,''))}</a>`).join('')}</div></td>
        <td class="notes-cell ${o.notes? '' : 'empty'}" data-offer-notes="${o.id}">${escapeHtml(o.notes||'')}</td>
        <td><div class="actions-cell">
          <button class="action-btn archive" data-archive="${o.id}" title="Archive">📦</button>
          <button class="action-btn delete" data-delete="${o.id}" title="Delete">🗑️</button>
        </div></td>
      </tr>`;
    } else {
      html += `<tr>
        <td class="offer-cell" data-offer="${o.id}">
          <div class="offer-name">${escapeHtml(o.offerName)}</div>
          <div class="offer-adv">${escapeHtml(o.advertiser)}</div>
        </td>
        <td class="geo-cell">${escapeHtml(geoDisplay)}</td>
        ${PLATFORMS.map(p=>{
          const c = cellFor(o.id, p);
          if(!c || c.archived){
            return `<td><div class="cell-slot" data-offer="${o.id}" data-platform="${p}">+</div></td>`;
          }
          const st = statusOf(c.status);
          const sub = c.status==='paused' ? (c.pauseReason || fmtDate(c.pausedAt)) : (c.buyer || fmtDate(c.startedAt));
          return `<td><div class="status-cell" data-offer="${o.id}" data-platform="${p}" style="background:${st.color}22;">
            <span class="st-label" style="color:${st.color}">${st.label}</span>
            <span class="st-sub" style="color:var(--text-faint)">${escapeHtml(sub||'')}</span>
          </div></td>`;
        }).join('')}
        <td><div class="material-cell ${(o.materials&&o.materials.length)? '' : 'empty'}" data-offer-mat="${o.id}">${(o.materials||[]).map(m=>`<a class="material-chip" href="${escapeHtml(m.url)}" target="_blank" rel="noopener" title="${escapeHtml(m.label||m.url)}" onclick="event.stopPropagation()">${escapeHtml(m.label || m.url.replace(/^https?:\/\//,''))}</a>`).join('')}</div></td>
        <td class="notes-cell ${o.notes? '' : 'empty'}" data-offer-notes="${o.id}">${escapeHtml(o.notes||'')}</td>
        <td><div class="actions-cell">
          <button class="action-btn archive" data-archive="${o.id}" title="Archive">📦</button>
          <button class="action-btn delete" data-delete="${o.id}" title="Delete">🗑️</button>
        </div></td>
      </tr>`;
    }
  });

  html += '</tbody></table></div>';
  container.innerHTML = html;

  $$('.offer-cell', container).forEach(el=> el.addEventListener('click', ()=> openOfferDrawer(el.dataset.offer)));
  $$('.notes-cell', container).forEach(el=> el.addEventListener('click', ()=> openOfferDrawer(el.dataset.offerNotes)));
  $$('.material-cell', container).forEach(el=> el.addEventListener('click', ()=> openOfferDrawer(el.dataset.offerMat)));
  $$('.cell-slot, .status-cell', container).forEach(el=>{
    el.addEventListener('click', ()=> openCellDrawer(el.dataset.offer, el.dataset.platform));
  });
  $$('[data-archive]', container).forEach(btn=> btn.addEventListener('click', (e)=>{
    e.stopPropagation();
    const offerId = btn.dataset.archive;
    const offer = state.offers.find(o=>o.id===offerId);
    if(offer){
      offer.archived = !offer.archived;
      saveState();
      render();
      showToast(offer.archived ? 'Offer archived' : 'Offer unarchived');
    }
  }));
  $$('[data-delete]', container).forEach(btn=> btn.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(confirm('Delete this offer and all its tests?')){
      deleteOffer(btn.dataset.delete);
    }
  }));
}

function renderTable(){
  const tbody = $('#tableBody');
  if(!loaded){ tbody.innerHTML = '<tr class="empty-row"><td colspan="9">Loading…</td></tr>'; return; }

  const offers = filteredOffers();
  const rows = [];
  offers.forEach(o=>{
    PLATFORMS.forEach(p=>{
      const c = cellFor(o.id, p);
      if(c && !c.archived) rows.push({o,c,p});
    });
  });
  const statusFilter = $('#filterStatus').value;
  const finalRows = statusFilter ? rows.filter(r=>r.c.status===statusFilter) : rows;

  if(finalRows.length===0){ tbody.innerHTML = '<tr class="empty-row"><td colspan="9">No tests match these filters yet.</td></tr>'; return; }

  finalRows.sort((a,b)=> (b.c.updatedAt||'').localeCompare(a.c.updatedAt||''));

  tbody.innerHTML = finalRows.map(({o,c,p})=>{
    const st = statusOf(c.status);
    const geoDisplay = (Array.isArray(o.geo) && o.geo.length > 0)
      ? o.geo.map(code=>COUNTRIES.find(c=>c.code===code)?.name||code).join(', ')
      : '—';
    return `<tr data-offer="${o.id}" data-platform="${p}">
      <td style="font-weight:600">${escapeHtml(o.offerName)}</td>
      <td>${escapeHtml(o.advertiser)}</td>
      <td>${escapeHtml(geoDisplay)}</td>
      <td>${p}</td>
      <td>${escapeHtml(c.buyer||'—')}</td>
      <td><span class="status-pill" style="background:${st.color}22; color:${st.color}"><span class="dot" style="background:${st.color}"></span>${st.label}</span></td>
      <td class="num">${fmtDate(c.startedAt)}</td>
      <td class="num">${c.pausedAt ? fmtDate(c.pausedAt) + (c.pauseReason ? ' — '+escapeHtml(c.pauseReason) : '') : '—'}</td>
      <td>${escapeHtml(c.results||'—')}</td>
    </tr>`;
  }).join('');

  $$('tr[data-offer]', tbody).forEach(row=>{
    row.addEventListener('click', ()=> openCellDrawer(row.dataset.offer, row.dataset.platform));
  });
}

/* ---------- offer drawer ---------- */
function openOfferDrawer(offerId){
  drawerMode = 'offer';
  drawerOfferId = offerId || null;
  const o = offerId ? state.offers.find(x=>x.id===offerId) : null;
  const drawer = $('#drawer');
  const advList = FAMILY_ADVERTISERS[currentFam] || [];

  drawer.innerHTML = `
    <div class="drawer-head">
      <div><h2>${o ? 'Edit offer' : 'New offer'}</h2><div class="dsub">${currentFam}</div></div>
      <button class="close-x" id="closeDrawer">&times;</button>
    </div>
    <div class="field">
      <label>Advertiser</label>
      <input type="text" id="f-advertiser" list="advList" value="${escapeHtml(o?.advertiser||'')}" placeholder="e.g. ORBIO">
      <datalist id="advList">${advList.map(a=>`<option value="${a}">`).join('')}</datalist>
    </div>
    <div class="field-row">
      <div class="field"><label>Offer name</label><input type="text" id="f-offername" value="${escapeHtml(o?.offerName||'')}" placeholder="e.g. STABLEGRIP"></div>
      <div class="field">
        <label>Geo</label>
        <div class="country-selector">
          <div class="country-chips" id="geoChips"></div>
          <div class="country-picker" id="geoPicker">
            <div class="country-search">
              <input type="text" id="geoSearchInput" placeholder="Search countries...">
            </div>
            <div id="geoCountries"></div>
          </div>
          <button type="button" class="btn btn-ghost" id="geoToggleBtn" style="width:100%; text-align:left;">Select countries...</button>
        </div>
      </div>
    </div>
    <div class="field">
      <label>Material (advertorial links)</label>
      <div class="materials-box">
        <div id="materialsList"></div>
        <div class="material-add-row">
          <input type="text" class="url" id="f-material-url" placeholder="https://...">
          <input type="text" class="label" id="f-material-label" placeholder="Label (optional)">
        </div>
        <button class="btn btn-ghost" type="button" id="addMaterialBtn" style="width:100%;">+ Add link</button>
      </div>
    </div>
    <div class="field"><label>Notes</label><textarea id="f-notes" placeholder="General notes about this offer...">${escapeHtml(o?.notes||'')}</textarea></div>
    <div class="drawer-actions">
      <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">${o ? 'Save changes' : 'Add offer'}</button>
    </div>
    ${o ? '<button class="danger-link" id="deleteBtn">Remove offer (and all its tests)</button>' : ''}
  `;

  let draftMaterials = (o?.materials || []).map(m=>({...m}));
  function renderMaterialsList(){
    const box = $('#materialsList');
    if(draftMaterials.length===0){ box.innerHTML = '<div class="material-empty">No links yet.</div>'; return; }
    box.innerHTML = draftMaterials.map((m,i)=>`
      <div class="material-item">
        <a href="${escapeHtml(m.url)}" target="_blank" rel="noopener">${escapeHtml(m.label || m.url)}</a>
        <button type="button" class="rm" data-i="${i}">&times;</button>
      </div>
    `).join('');
    $$('.rm', box).forEach(btn=> btn.addEventListener('click', (e)=>{
      e.preventDefault();
      draftMaterials.splice(Number(btn.dataset.i), 1);
      renderMaterialsList();
    }));
  }
  renderMaterialsList();

  $('#addMaterialBtn').addEventListener('click', ()=>{
    const urlInput = $('#f-material-url');
    const labelInput = $('#f-material-label');
    let url = urlInput.value.trim();
    if(!url){ showToast('Add a link URL first'); return; }
    if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
    draftMaterials.push({ id: uid(), url, label: labelInput.value.trim() });
    urlInput.value = ''; labelInput.value = '';
    renderMaterialsList();
    urlInput.focus();
  });
  $('#f-material-url').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); $('#addMaterialBtn').click(); } });
  $('#f-material-label').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); $('#addMaterialBtn').click(); } });

  // Country selector setup
  draftGeos = (o?.geo || []).slice();
  function renderGeoChips(){
    const chips = $('#geoChips');
    chips.innerHTML = draftGeos.map(code=>{
      const country = COUNTRIES.find(c=>c.code===code);
      return `<div class="country-chip">${country?.name||code}<span class="remove" data-code="${code}">×</span></div>`;
    }).join('');
    $$('.remove', chips).forEach(btn=> btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      draftGeos = draftGeos.filter(c=>c!==btn.dataset.code);
      renderGeoChips();
      renderGeoOptions();
    }));
  }
  function renderGeoOptions(search=''){
    const filtered = COUNTRIES.filter(c=>c.name.toLowerCase().includes(search.toLowerCase()) || c.code.toLowerCase().includes(search.toLowerCase()));
    $('#geoCountries').innerHTML = filtered.map(c=>`
      <div class="country-option ${draftGeos.includes(c.code)?'selected':''}" data-code="${c.code}">
        ${c.code} - ${c.name}
      </div>
    `).join('');
    $$('.country-option', $('#geoCountries')).forEach(opt=> opt.addEventListener('click', (e)=>{
      e.stopPropagation();
      const code = opt.dataset.code;
      if(draftGeos.includes(code)){ draftGeos = draftGeos.filter(c=>c!==code); }
      else{ draftGeos.push(code); }
      renderGeoChips();
      renderGeoOptions(search);
    }));
  }
  renderGeoChips();
  renderGeoOptions();
  $('#geoToggleBtn').addEventListener('click', (e)=>{
    e.preventDefault();
    $('#geoPicker').classList.toggle('open');
  });
  $('#geoSearchInput').addEventListener('input', (e)=>{
    renderGeoOptions(e.target.value);
  });
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.country-selector')) $('#geoPicker').classList.remove('open');
  });

  $('#closeDrawer').addEventListener('click', closeDrawer);
  $('#cancelBtn').addEventListener('click', closeDrawer);
  if(o) $('#deleteBtn').addEventListener('click', ()=> deleteOffer(o.id));
  $('#saveBtn').addEventListener('click', ()=>{
    const pendingUrl = $('#f-material-url').value.trim();
    if(pendingUrl){ $('#addMaterialBtn').click(); }
    saveOfferFromDrawer(draftMaterials);
  });
  $('#overlay').classList.add('open');
}

async function saveOfferFromDrawer(materials){
  const advertiser = $('#f-advertiser').value.trim();
  const offerName = $('#f-offername').value.trim();
  if(!advertiser || !offerName){ showToast('Advertiser and offer name are required'); return; }
  const data = { advertiser, offerName, geo: draftGeos, notes: $('#f-notes').value.trim(), materials: materials || [] };

  if(drawerOfferId){
    const idx = state.offers.findIndex(o=>o.id===drawerOfferId);
    if(idx>-1) state.offers[idx] = { ...state.offers[idx], ...data };
    showToast('Offer updated');
  }else{
    state.offers.push({ id: uid(), family: currentFam, materials: [], createdAt: new Date().toISOString(), createdBy: getViewerName(), ...data });
    showToast('Offer added');
  }
  await saveState();
  closeDrawer();
  render();
}

async function deleteOffer(id){
  state.offers = state.offers.filter(o=>o.id!==id);
  state.cells = state.cells.filter(c=>c.offerId!==id);
  await saveState();
  closeDrawer();
  render();
  showToast('Offer removed');
}

/* ---------- cell (platform test) drawer ---------- */
function openCellDrawer(offerId, platform){
  drawerMode = 'cell';
  drawerOfferId = offerId;
  drawerPlatform = platform;
  const o = state.offers.find(x=>x.id===offerId);
  const c = cellFor(offerId, platform);
  const drawer = $('#drawer');
  const geoDisplay = (Array.isArray(o.geo) && o.geo.length > 0)
    ? o.geo.map(code=>COUNTRIES.find(c=>c.code===code)?.name||code).join(', ')
    : '—';

  drawer.innerHTML = `
    <div class="drawer-head">
      <div><h2>${platform}</h2><div class="dsub">${escapeHtml(o.offerName)} — ${escapeHtml(o.advertiser)} · ${geoDisplay}</div></div>
      <button class="close-x" id="closeDrawer">&times;</button>
    </div>
    <div class="field"><label>Status</label><div class="status-row" id="statusRow"></div></div>
    <div class="field-row">
      <div class="field"><label>Started receiving traffic</label><input type="date" id="f-started" value="${c?.startedAt||''}"></div>
      <div class="field"><label>Paused on</label><input type="date" id="f-paused" value="${c?.pausedAt||''}"></div>
    </div>
    <div class="field"><label>Pause / kill reason</label><input type="text" id="f-pausereason" value="${escapeHtml(c?.pauseReason||'')}" placeholder="e.g. CPA above cap, 0 rev, disapproved..."></div>
    <div class="field"><label>Assigned buyer</label><input type="text" id="f-buyer" value="${escapeHtml(c?.buyer||'')}" placeholder="e.g. Marco"></div>
    <div class="field"><label>Results / notes</label><textarea id="f-results" placeholder="Spend, ROI, conversions, tracker link...">${escapeHtml(c?.results||'')}</textarea></div>
    <div class="drawer-actions">
      <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">${c ? 'Save changes' : 'Add test'}</button>
    </div>
    ${c ? `<div style="display:flex; gap:8px; margin-top:12px;">
      <button class="btn btn-ghost" id="archiveBtn" style="flex:1; justify-content:center;">${c?.archived ? 'Unarchive' : 'Archive'}</button>
      <button class="danger-link" id="deleteBtn" style="flex:1; margin:0;">Delete</button>
    </div>` : ''}
  `;

  let selectedStatus = c?.status || 'to_test';
  const statusRow = $('#statusRow');
  STATUSES.forEach(st=>{
    const chip = document.createElement('button');
    chip.type='button';
    chip.className = 'status-chip' + (st.key===selectedStatus ? ' active' : '');
    chip.textContent = st.label;
    chip.style.background = st.key===selectedStatus ? st.color : '';
    chip.addEventListener('click', ()=>{
      selectedStatus = st.key;
      $$('.status-chip', statusRow).forEach(ch=>{ ch.classList.remove('active'); ch.style.background=''; });
      chip.classList.add('active'); chip.style.background = st.color;
      const startedField = $('#f-started'), pausedField = $('#f-paused');
      if((st.key==='running'||st.key==='retesting') && !startedField.value) startedField.value = todayISO();
      if(st.key==='paused' && !pausedField.value) pausedField.value = todayISO();
    });
    statusRow.appendChild(chip);
  });

  $('#closeDrawer').addEventListener('click', closeDrawer);
  $('#cancelBtn').addEventListener('click', closeDrawer);
  if(c) {
    $('#deleteBtn').addEventListener('click', ()=> deleteCell(c.id));
    $('#archiveBtn').addEventListener('click', ()=> archiveCell(c.id));
  }
  $('#saveBtn').addEventListener('click', ()=> saveCellFromDrawer(selectedStatus));
  $('#overlay').classList.add('open');
}

async function saveCellFromDrawer(status){
  const data = {
    offerId: drawerOfferId, platform: drawerPlatform, status,
    startedAt: $('#f-started').value, pausedAt: $('#f-paused').value,
    pauseReason: $('#f-pausereason').value.trim(), buyer: $('#f-buyer').value.trim(),
    results: $('#f-results').value.trim(), updatedAt: new Date().toISOString(),
  };
  const existing = cellFor(drawerOfferId, drawerPlatform);
  if(existing){
    const idx = state.cells.findIndex(c=>c.id===existing.id);
    state.cells[idx] = { ...state.cells[idx], ...data };
    showToast('Test updated');
  }else{
    state.cells.push({ id: uid(), createdAt: new Date().toISOString(), createdBy: getViewerName(), ...data });
    showToast('Test assigned');
  }
  await saveState();
  closeDrawer();
  render();
}

async function deleteCell(id){
  state.cells = state.cells.filter(c=>c.id!==id);
  await saveState();
  closeDrawer();
  render();
  showToast('Test removed');
}

async function archiveCell(id){
  const idx = state.cells.findIndex(c=>c.id===id);
  if(idx>-1){
    state.cells[idx].archived = !state.cells[idx].archived;
    await saveState();
    closeDrawer();
    render();
    showToast(state.cells[idx].archived ? 'Test archived' : 'Test unarchived');
  }
}

function closeDrawer(){ $('#overlay').classList.remove('open'); drawerMode=null; drawerOfferId=null; drawerPlatform=null; }

/* ---------- wiring ---------- */
$$('[data-fam]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    $$('[data-fam]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFam = btn.dataset.fam;
    $('#viewTitle').textContent = `${currentFam} — ${currentView==='matrix'?'Matrix':'List / Tracker'}`;
    render();
  });
});
$$('[data-view]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    $$('[data-view]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentView = btn.dataset.view;
    $('#matrixView').style.display = currentView==='matrix' ? '' : 'none';
    $('#tableView').style.display = currentView==='table' ? '' : 'none';
    $('#viewTitle').textContent = `${currentFam} — ${currentView==='matrix'?'Matrix':'List / Tracker'}`;
    $('#viewSub').textContent = currentView==='matrix' ? 'Click an empty cell to assign a test on that platform.' : 'Every platform test, filterable and sortable.';
    render();
  });
});
$('#addBtn').addEventListener('click', ()=> openOfferDrawer(null));
$('#overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeDrawer(); });
$('#searchInput').addEventListener('input', render);
$('#filterAdvertiser').addEventListener('change', render);
$('#filterStatus').addEventListener('change', render);

(async function init(){
  await loadState();
  render();
})();
</script>
</body>
</html>
